openapi: 3.1.0
info:
  title: ScrapeForge API
  version: 1.0.0
  description: |
    ScrapeForge is a high-performance web scraping API with tiered engine routing,
    AI-powered data extraction, proxy management, and real-time streaming.
  contact:
    name: ScrapeForge Support
  license:
    name: Proprietary

servers:
  - url: http://localhost:3000
    description: Local development

security:
  - BearerAuth: []

tags:
  - name: Scrape
    description: Core scraping operations
  - name: Extract
    description: AI-powered data extraction
  - name: Status
    description: Job status & results
  - name: Streaming
    description: Server-Sent Events for real-time progress
  - name: Keys
    description: API key management
  - name: Health
    description: Service health

paths:
  /health:
    get:
      summary: Health check
      tags: [Health]
      security: []
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  uptime:
                    type: number

  /metrics:
    get:
      summary: Prometheus metrics
      tags: [Health]
      security: []
      responses:
        "200":
          description: Prometheus text format metrics
          content:
            text/plain:
              schema:
                type: string

  /v1/scrape:
    post:
      summary: Scrape a web page
      description: |
        Submits a scrape request. If no `webhookUrl` is provided, the request is
        processed synchronously and the response contains the scraped content.
        Otherwise, it returns immediately with a job ID and delivers results
        to the webhook when complete.

        Only `url` is required. All other fields have safe defaults — leave them
        out if you're not sure. Omit `webhookUrl` entirely to get a synchronous
        response (do **not** send an empty string).
      tags: [Scrape]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScrapeRequest"
            examples:
              minimal:
                summary: Minimal — just a URL
                value:
                  url: https://example.com
              markdown:
                summary: Scrape as clean markdown
                value:
                  url: https://en.wikipedia.org/wiki/Web_scraping
                  formats: [markdown]
              javascriptHeavy:
                summary: JS-heavy site with screenshot
                value:
                  url: https://www.cnn.com
                  formats: [markdown, screenshot]
                  screenshot: true
                  waitFor: "main"
              mobileView:
                summary: Mobile emulation (iPhone)
                value:
                  url: https://techcrunch.com
                  mobile: true
                  formats: [markdown]
      responses:
        "200":
          description: Scrape completed (synchronous mode)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScrapeResult"
        "202":
          description: Job queued (async / webhook mode)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobQueued"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          description: Scrape failed across all tiers (anti-bot, DNS, etc.)
        "504":
          description: Job timed out

  /v1/extract:
    post:
      summary: Extract structured data with AI
      description: |
        Scrapes the page and returns structured JSON matching the provided
        schema in `content.json`. Required fields: `url` + `schema`. Omit
        `webhookUrl` entirely for a synchronous response.

        The engine tries cheap deterministic sources first (structured data
        such as JSON-LD/microdata, then a learned extraction recipe for the
        site's template) and asks a model only for what is still missing.
        Every value is traced to the page: model answers that cannot be found
        on the page are rejected, never returned. Markdown content is
        returned alongside.

        How to read the result (`metadata.extraction`):
        * `status: complete` — schema-valid data, nothing truncated, and every
          missing field is genuinely absent from the page (`not_found` on a
          field the schema allows to be null or left out).
        * `status: partial` — usable data, but something is missing for
          another reason (rejected, ambiguous, unparseable, provider failure,
          truncated input or output, listing records dropped because none of
          their values could be accepted, a structured-data list that covers
          only part of the listing), a value was returned unverified because
          the model could not check it (`unverified_values:<field>`), or the
          data does not validate against your schema (`schemaValid: false`,
          see `schemaErrors`).
        * `status: failed` — no usable data: blocked/challenge page, invalid
          schema, provider failure with nothing else to go on, or nothing
          found. `content.json` is omitted.
        Only `complete` extractions are cached (see `cacheTtl`): a partial or
        failed one may come from this request's spend cap, timeout or a
        transient provider problem.
        `missing` lists each absent value with its JSON pointer and reason;
        `warnings` are machine-readable notes (e.g. `citation_mismatch:/price`,
        `structured_value_not_visible:sku`, `source_page_blocked:challenge_page`,
        `invalid_schema:<code>: <message>`,
        `multiple_records_for_object_schema:<n>` (see `CustomerSchema`),
        `structured_list_incomplete:<listed>_of_<onPage>`,
        `output_limit_records:<sent>_of_<onPage>` (a listing larger than the
        model's output limit: only the records that fit were sent)).

        Listings larger than the model's output limit are `partial`: the
        engine sends only the records the model's answer can hold and reports
        the rest as `not_processed` on the list's pointer.

        Synchronous jobs are retried once after 250 ms; webhook jobs up to
        three times with exponential backoff. Unreachable or private hosts
        are not retried.
      tags: [Extract]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExtractRequest"
            examples:
              shorthand:
                summary: Shorthand schema ("type — description")
                value:
                  url: https://example.com/product/123
                  schema:
                    title: "string — product title"
                    price: "number — current price"
                    currency: "string — ISO 4217 code"
                    inStock: "boolean — whether the item can be bought"
              listing:
                summary: Every product card on a listing page, with evidence
                value:
                  url: https://example.com/collections/all
                  includeEvidence: true
                  maxLlmCostUsd: 0.01
                  schema:
                    products:
                      - name: "string — product name"
                        price: "number — current price"
                        url: "url — product page"
              productPage:
                summary: Extract product fields (JSON Schema)
                value:
                  url: https://example.com/product/123
                  schema:
                    type: object
                    properties:
                      title: { type: string }
                      price: { type: number }
                      currency: { type: string }
                      inStock: { type: boolean }
                    required: [title, price]
              articleMetadata:
                summary: Extract article metadata
                value:
                  url: https://en.wikipedia.org/wiki/Web_scraping
                  schema:
                    properties:
                      title: { type: string }
                      summary: { type: string }
                      authors:
                        type: array
                        items: { type: string }
      responses:
        "200":
          description: Extraction completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScrapeResult"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          description: Extraction failed
        "504":
          description: Extraction timed out

  /v1/status/{jobId}:
    get:
      summary: Get job status
      tags: [Status]
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            example: job_abc123def456
      responses:
        "200":
          description: Job status and result (if completed)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ScrapeResult"
                  - type: object
                    properties:
                      jobId:
                        type: string
                      status:
                        type: string
                        enum: [queued, processing, waiting]
        "404":
          description: Job not found

  /v1/scrape/stream:
    get:
      summary: Stream job progress via SSE
      description: |
        Opens a Server-Sent Events stream for a given job. Events include
        `started`, `headers`, `content`, `extraction`, `complete`, and `error`.
      tags: [Streaming]
      security: []
      parameters:
        - name: jobId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: SSE event stream
          content:
            text/event-stream:
              schema:
                type: string

  /v1/keys/rotate:
    post:
      summary: Rotate API key
      description: |
        Deactivates the current API key and generates a new one. The new key
        inherits the old key's name and rate limit settings.
      tags: [Keys]
      responses:
        "200":
          description: Key rotated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  key:
                    type: string
                    description: The new full API key (shown only once)
                  keyId:
                    type: string
                  prefix:
                    type: string
        "404":
          description: Current key not found

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: "Pass your API key as Authorization: Bearer sf_live_..."

  schemas:
    ScrapeRequest:
      type: object
      required: [url]
      description: |
        Only `url` is required. Every other property is optional and has a safe
        default. If you omit a property entirely, the server uses its default.
        Do not send empty strings for URL-typed fields (`webhookUrl`, `waitFor`) —
        omit them instead.
      properties:
        url:
          type: string
          format: uri
          description: The URL to scrape. Must be a public HTTP/HTTPS address.
          example: https://example.com
        formats:
          type: array
          description: Which output formats to return in `content`.
          items:
            type: string
            enum: [html, markdown, text, screenshot, json]
          default: [markdown]
        waitFor:
          type: string
          nullable: true
          description: |
            CSS selector to wait for before extracting content. Forces the
            browser tier. Leave empty to skip.
          example: "#main-content"
        timeout:
          type: integer
          minimum: 1000
          maximum: 120000
          default: 60000
          description: Per-request timeout in milliseconds.
        proxy:
          type: string
          enum: [none, datacenter, residential, mobile, auto]
          default: auto
          description: |
            Proxy tier. `auto` lets the router pick based on domain history.
        headers:
          type: object
          description: |
            Extra HTTP headers to send with the request. Sent by the plain
            HTTP fetch tiers only: when the page is rendered in a browser
            tier, they are not applied. Part of the cache key (as a hash; see
            `cacheTtl`).
          additionalProperties:
            type: string
        cookies:
          type: array
          description: |
            Cookies for the request. **Known limitation:** they are accepted
            and validated but currently not applied by any fetch tier, so the
            page is fetched without them. Part of the cache key (as a hash;
            see `cacheTtl`).
          items:
            type: object
            required: [name, value]
            properties:
              name: { type: string }
              value: { type: string }
              domain: { type: string }
              path: { type: string }
        screenshot:
          type: boolean
          default: false
          description: If true, returns a base64 PNG in `content.screenshot`.
        mobile:
          type: boolean
          default: false
          description: |
            Emulate an iPhone (390×844 viewport + iOS Safari UA). Forces the
            browser tier so JS-rendered mobile layouts work.
        blockResources:
          type: boolean
          default: true
          description: Block fonts, media, and tracker domains in browser tiers.
        cacheTtl:
          type: integer
          minimum: 0
          maximum: 2592000
          default: 3600
          description: |
            Cache TTL in seconds. Set to 0 to skip the cache entirely (it is
            neither read nor written). A cached result is served only to the
            same account for the same request: the key covers the URL,
            `formats`, `proxy`, `screenshot`, `mobile`, `waitFor`,
            `blockResources`, the extraction schema, `includeEvidence`,
            `maxLlmCostUsd` (with a schema) and a hash of `headers` and
            `cookies` (their values are never stored in the key); `timeout`
            and `webhookUrl` do not count. Plain scrapes are cached; an
            extraction only when its status is `complete`.
        webhookUrl:
          type: string
          format: uri
          nullable: true
          description: |
            If provided, results are delivered asynchronously via POST webhook
            and the API returns `202 Queued` immediately. **Omit this field
            entirely** (do not send `""`) for a synchronous response.
        extractSchema:
          $ref: "#/components/schemas/CustomerSchema"
        includeEvidence:
          type: boolean
          default: false
          description: |
            Return per-field evidence in `metadata.extraction.evidence`: where
            each value came from (structured data item, recipe, or the page
            block the model cited), the raw text before normalization, the
            normalization steps applied, and whether it was verified on the page.
        maxLlmCostUsd:
          type: number
          minimum: 0
          maximum: 1
          description: |
            Spend cap for model calls of this request, in USD. The server's own
            cap (default $0.05) applies when it is lower. When the cap is
            reached, fields still unresolved are reported as missing with
            reason `provider_failure` (`budget_exhausted`).

    CustomerSchema:
      type: object
      description: |
        What to extract. Either a JSON Schema (an object, an array of
        objects, or an object wrapping exactly one array of objects, which is
        kept as a wrapper in the output) or the shorthand form
        `{"field": "type — description"}` with types `string`, `number`,
        `integer`, `boolean`, `url`, `date`, `datetime`, nested objects and
        lists written as `"string[]"` or as one-item arrays such as `["string"]` or `[{"name": "string"}]`.
        Shorthand fields are optional and nullable; a shorthand schema with
        one array field is a listing, otherwise the engine returns an array
        when the page lists several matching items and an object otherwise.
        A JSON Schema with `"type": "object"` at the root always returns ONE
        object, even on a listing or search page (an array would not match
        your schema); when the page clearly holds several matching records,
        `warnings` contains `multiple_records_for_object_schema:<n>`.
        Migration for clients that relied on the old engine returning an
        array for such schemas: ask for a list explicitly (`"type": "array"`
        with object `items`, or a wrapper object with one array property such
        as `{"type": "object", "properties": {"items": {"type": "array",
        "items": {...}}}}`), or let the engine decide (shorthand, or a root
        with `properties` but no `"type"`, which returns an object or an
        array).
        Mark inferred fields (a summary, a classification) with
        `"x-derived": true`: they are exempt from verbatim grounding and are
        labelled `derived` in evidence. Limits: 64 KB serialized, 10 levels
        of nesting (checked before queueing, 400); local `$ref` only, safe
        `pattern`s only, 300 properties (checked by the worker: reported as
        an `invalid_schema:*` warning with `status: failed`).
      additionalProperties: true

    ExtractRequest:
      allOf:
        - $ref: "#/components/schemas/ScrapeRequest"
        - type: object
          required: [schema]
          properties:
            schema:
              $ref: "#/components/schemas/CustomerSchema"

    ScrapeResult:
      type: object
      properties:
        jobId:
          type: string
        url:
          type: string
        status:
          type: string
          enum: [completed, failed]
        content:
          type: object
          properties:
            markdown:
              type: string
            text:
              type: string
            html:
              type: string
            screenshot:
              type: string
              description: Base64-encoded PNG (only when screenshot=true)
            json:
              description: |
                Extracted data: an object, an array of records, or the wrapper
                object your schema declared. Omitted when the extraction failed.
              oneOf:
                - type: object
                  additionalProperties: true
                - type: array
                  items:
                    type: object
                    additionalProperties: true
        metadata:
          type: object
          properties:
            extraction:
              $ref: "#/components/schemas/ExtractionMetadata"
            timings:
              $ref: "#/components/schemas/Timings"
            tierUsed:
              type: integer
              minimum: 1
              maximum: 5
            proxyTier:
              type: string
            latencyMs:
              type: integer
            qualityScore:
              type: number
              minimum: 0
              maximum: 1
            cached:
              type: boolean
            costBreakdown:
              type: object
              properties:
                compute:
                  type: number
                proxy:
                  type: number
                captcha:
                  type: number
                llm:
                  type: number
                total:
                  type: number

    ExtractionMetadata:
      type: object
      description: Outcome of structured extraction (present when a schema was given).
      required: [status, method, schemaValid, missing, warnings, scope, llm]
      properties:
        status:
          type: string
          enum: [complete, partial, failed]
          description: See the /v1/extract description for exact semantics.
        method:
          type: string
          enum: [structured-data, recipe, llm, mixed, none]
          description: Where the returned values came from.
        schemaValid:
          type: boolean
          description: content.json validates against your schema. Never true for failed extractions.
        schemaErrors:
          type: array
          items: { type: string }
        missing:
          type: array
          items:
            type: object
            required: [path, reason]
            properties:
              path:
                type: string
                description: JSON pointer into content.json ("/price", "/items/3/price"; "/items" for the list itself).
              reason:
                type: string
                enum: [not_found, not_processed, ambiguous, provider_failure, truncated, rejected_ungrounded, unparseable]
                description: |
                  `not_found` — not on the page. `not_processed` — part of the page was not
                  sent to the model (input too large, a listing larger than the model's
                  output limit, a structured-data list covering only part of the listing)
                  or the page was blocked.
                  `ambiguous` — several conflicting values (e.g. a price range).
                  `provider_failure` — the model call failed (detail: auth, quota,
                  budget_exhausted, no_model_configured, …). `truncated` — the model's
                  output was cut off. `rejected_ungrounded` — the model reported a value
                  that is not on the page (on a list's pointer: records dropped because
                  none of their values could be accepted). `unparseable` — the page shows
                  a value that cannot be converted to the field's type ("Free" for a
                  number, "4.5 out of 5" for an integer); detail says why.
                  Only `not_found` on a field that may be null or absent keeps the
                  status `complete`.
              detail:
                type: string
        warnings:
          type: array
          items: { type: string }
        scope:
          type: object
          properties:
            url: { type: string }
            snapshotHash:
              type: string
              description: sha256 of the HTML the extraction ran on.
            description:
              type: string
              enum: [page-snapshot]
              description: What "complete" refers to.
            blocksTotal: { type: integer }
            blocksSentToModel: { type: integer }
            recordsDetected:
              type: integer
              description: Size of the largest group of repeated items detected on the page.
            truncated:
              type: boolean
              description: Part of the page was not sent to the model (status is then never complete).
        llm:
          type: object
          properties:
            calls:
              type: integer
              description: Model calls made, failed ones included.
            inputTokens: { type: integer }
            outputTokens: { type: integer }
            costUsd: { type: number }
            models:
              type: array
              items: { type: string }
        evidence:
          type: array
          description: Only with includeEvidence.
          items:
            type: object
            required: [path, source, grounded]
            properties:
              path: { type: string }
              source:
                type: string
                enum: [structured-data, recipe, dom, llm]
              blockId: { type: string }
              structuredId: { type: string }
              excerpt: { type: string }
              raw: {}
              normalization:
                type: array
                items: { type: string }
              grounded:
                type: boolean
                description: The raw value was verified on the page.
              derived: { type: boolean }
              note: { type: string }

    Timings:
      type: object
      description: Where the time went, for this request.
      properties:
        stages:
          type: object
          additionalProperties: { type: number }
          description: Stage → milliseconds (fetch, content, extract, document, structured, recipe, llm, validate, …).
        attempts:
          type: array
          description: Router tier attempts in order.
          items:
            type: object
            properties:
              tier: { type: integer }
              ms: { type: number }
              outcome:
                type: string
                enum: [accepted, rejected, error]
              reason: { type: string }
        totalMs: { type: number }

    JobQueued:
      type: object
      properties:
        jobId:
          type: string
        status:
          type: string
          example: queued
        statusUrl:
          type: string

  responses:
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              details:
                type: object

    Unauthorized:
      description: Missing or invalid API key
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: Invalid or deactivated API key.

    RateLimited:
      description: Too many requests
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              retryAfter:
                type: integer
      headers:
        X-RateLimit-Limit:
          schema:
            type: integer
        X-RateLimit-Remaining:
          schema:
            type: integer
        X-RateLimit-Reset:
          schema:
            type: integer
