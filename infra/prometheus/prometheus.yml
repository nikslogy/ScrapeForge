global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: scrapeforge-api
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:3000']
        labels:
          service: api

  - job_name: scrapeforge-worker
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:9091']
        labels:
          service: worker
